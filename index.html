<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RazeVolt IO | Client Success Advisory</title>
<meta name="description" content="RazeVolt IO is a private client success advisory for established businesses and distinguished brands.">
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --line: rgba(255, 255, 255, 0.12);
    --card: rgba(255, 255, 255, 0.03);
    --max: 1120px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .container { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  section { padding: 120px 0; border-top: 1px solid var(--line); }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  h1, h2, h3 { font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; }
  h2 { font-size: clamp(32px, 4vw, 48px); margin-bottom: 20px; }
  h3 { font-size: 22px; font-weight: 400; margin-bottom: 12px; }

  p.lead { color: var(--muted); font-size: 18px; max-width: 620px; }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--text);
    transition: all 0.3s ease;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: transparent; color: var(--text); }
  .btn-ghost:hover { background: var(--text); color: var(--bg); }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(0, 0, 0, 0.7);
    border-bottom: 1px solid var(--line);
  }
  nav .container {
    display: flex; justify-content: space-between; align-items: center; height: 72px;
  }
  .logo { font-weight: 500; letter-spacing: 0.04em; font-size: 16px; }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a { font-size: 14px; color: var(--muted); transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }

  /* Hero */
  .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 120px; border-top: none; }
  .hero h1 { font-size: clamp(40px, 5.8vw, 78px); max-width: 1000px; margin-bottom: 32px; }
  .hero h1 span { color: var(--muted); }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 48px; }
  .hero-stats {
    display: flex; gap: 64px; margin-top: 96px; padding-top: 40px; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .stat-num { font-size: 40px; font-weight: 300; }
  .stat-label { font-size: 13px; color: var(--muted); }

  /* Services */
  .services-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 72px;
  }
  .service {
    background: var(--bg); padding: 56px 40px; min-height: 260px;
    display: flex; flex-direction: column; transition: background 0.3s;
  }
  .service h3 { margin-bottom: 16px; }
  .service p { margin-top: auto; }
  .service:hover { background: var(--card); }
  .service-index { font-size: 13px; color: var(--muted); margin-bottom: 40px; display: block; }
  .service p { color: var(--muted); font-size: 15px; }

  /* Mockup */
  .case {
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; margin-top: 72px;
  }
  .case-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .metric { background: var(--bg); padding: 40px 32px; }
  .metric-value { font-size: 48px; font-weight: 300; margin-bottom: 8px; }
  .metric-label { font-size: 13px; color: var(--muted); }
  .case-quote {
    font-size: 22px; font-weight: 300; line-height: 1.5; margin-top: 48px;
    padding-left: 24px; border-left: 1px solid var(--text);
  }
  .case-author { font-size: 14px; color: var(--muted); margin-top: 16px; padding-left: 24px; }

  /* How it works */
  .steps { margin-top: 72px; display: flex; flex-direction: column; }
  .step {
    display: grid; grid-template-columns: 120px 1fr; gap: 32px; padding: 48px 0;
    border-top: 1px solid var(--line);
  }
  .step:last-child { border-bottom: 1px solid var(--line); }
  .step-num { font-size: 14px; color: var(--muted); padding-top: 6px; }
  .step p { color: var(--muted); max-width: 620px; }

  /* CTA / Application */
  .cta { text-align: center; }
  .cta p.lead { margin: 0 auto 48px; }
  .cta-note { font-size: 13px; color: var(--muted); margin-top: 24px; }

  footer {
    border-top: 1px solid var(--line); padding: 48px 0; font-size: 13px; color: var(--muted);
  }
  footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }

  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #0a0a0a; border: 1px solid var(--line); width: 100%; max-width: 520px;
    padding: 48px 40px; position: relative; max-height: 90vh; overflow-y: auto;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px; background: none; border: none;
    color: var(--muted); font-size: 28px; cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal h3 { font-size: 26px; font-weight: 300; margin-bottom: 8px; }
  .modal .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  form .field { margin-bottom: 20px; }
  form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  form input, form select, form textarea {
    width: 100%; background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 14px 16px; font-family: inherit; font-size: 15px; border-radius: 0;
    transition: border-color 0.2s;
  }
  form input:focus, form select:focus, form textarea:focus { outline: none; border-color: var(--text); }
  form select option { background: #000; }
  form textarea { resize: vertical; min-height: 96px; }
  form .btn { width: 100%; margin-top: 8px; }
  .form-success { display: none; text-align: center; padding: 24px 0; }
  .form-success.show { display: block; }
  .form-error { color: #ff6b6b; font-size: 0.875rem; margin: 0.5rem 0; }

  /* Reveal animation */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s ease, transform 0.8s ease; }
